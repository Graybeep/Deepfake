<!doctype html>
<!--
  Single self-contained page. No build step, no dependencies, no framework.

  Deliberately deployable two ways from one file:
    * served by the API itself at /app  -> same origin, so CORS never applies
    * uploaded to a static host (Vercel) -> cross-origin, needs DF_CORS_ORIGINS

  The API base defaults to this page's own origin, so the same file works in both
  places. Override with ?api=https://host for the static-host case.

  What it renders is the point: not a verdict alone, but the evidence behind it.
  Per-face scores with detection confidence, what the confidence gate discarded
  and why, coverage, and every advisory the API attaches. A single opaque
  "uncertain" reads as broken; the same result with its reasoning shown reads as
  a system that knows what it does not know.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deepfake Detection</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --line:#262b36; --ink:#e8ecf2; --muted:#9aa4b2;
      --accent:#5b9dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --unk:#8b949e;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
    header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    h1{font-size:21px;margin:0;letter-spacing:-.2px}
    .health{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--unk)}
    .dot.up{background:var(--ok)} .dot.down{background:var(--bad)}
    .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
    .drop{border:1.5px dashed var(--line);border-radius:10px;padding:34px 18px;text-align:center;
      cursor:pointer;transition:border-color .15s,background .15s}
    .drop:hover,.drop.over{border-color:var(--accent);background:#1b2130}
    .drop input{display:none}
    .drop b{color:var(--accent)}
    .hint{color:var(--muted);font-size:12px;margin-top:8px}
    button{background:var(--accent);color:#08111f;border:0;border-radius:7px;padding:9px 16px;
      font-weight:600;font-size:14px;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    .stage{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
    /* The verdict a non-specialist reads first: a plain sentence, then a scale
       that says which end is which. The old version showed "0.79 / 100" with
       nothing indicating that low means authentic -- a number with no direction
       is worse than no number, because it invites the reader to guess. */
    .headline{font-size:25px;font-weight:700;letter-spacing:-.3px;margin:0 0 5px}
    .plain{color:var(--muted);font-size:14px;margin:0 0 18px}
    .meter{margin:0 0 6px}
    .track{position:relative;height:10px;border-radius:6px;overflow:hidden;display:flex}
    .track i{flex:1}
    .pin{position:absolute;top:-5px;width:3px;height:20px;background:var(--ink);
      border-radius:2px;box-shadow:0 0 0 2px var(--panel);transform:translateX(-1.5px)}
    .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
      margin-top:7px}
    .ends b{font-weight:600;color:var(--ink)}
    .facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);
      margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
    /* One short honest line, always visible. The three full advisories are kept
       verbatim in the details block below -- condensed here, never dropped. */
    .caution{display:flex;gap:10px;border-left:3px solid var(--warn);background:#1d1a12;
      padding:11px 13px;border-radius:0 6px 6px 0;font-size:13px;color:#e8dcc0;margin-top:16px}
    .caution b{display:block;margin-bottom:2px;color:#f0e4c8}
    details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
    summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
    summary::-webkit-details-marker{display:none}
    summary::before{content:"\25B8 ";display:inline-block;transition:transform .15s}
    details[open] summary::before{transform:rotate(90deg)}
    summary:hover{color:var(--ink)}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
    th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    tr.gated{color:var(--muted)}
    .adv{margin:14px 0 0;padding:0;list-style:none}
    .adv li{border-left:3px solid var(--warn);background:#1d1a12;padding:9px 12px;margin-bottom:8px;
      border-radius:0 6px 6px 0;font-size:13px;color:#e8dcc0}
    .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;
      font-size:12px}
    .meta div{background:#12151b;border:1px solid var(--line);border-radius:7px;padding:9px 11px}
    .meta span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
    .meta code{font-size:11px;word-break:break-all}
    .err{border-left:3px solid var(--bad);background:#1e1315;padding:11px 13px;border-radius:0 6px 6px 0;
      font-size:13px;color:#f5c2c0}
    footer{color:var(--muted);font-size:11px;margin-top:26px;line-height:1.7}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Deepfake Detection</h1>
    <div class="health"><span class="dot" id="dot"></span><span id="health">checking…</span></div>
  </header>
  <p class="sub">Upload a photo to check it for signs of face manipulation.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <div><b>Choose a photo</b> or drop one here</div>
      <div class="hint">Photos only — JPEG, PNG or HEIC, straight from a phone.
        Video is not available in this build.</div>
    </label>
    <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
      <button id="go" disabled>Analyse</button>
      <span class="stage" id="stage"></span>
    </div>
  </div>

  <div id="out"></div>

  <footer>
    Research prototype. The detector is a public research checkpoint that has not
    been validated for this use, and its scores can be deliberately fooled.
    Use it to decide what to look at, never as evidence.
  </footer>
</div>

<script>
// API base: this page's origin by default, so serving from the API needs no
// config and no CORS. ?api=... overrides it for a static host.
const API = new URLSearchParams(location.search).get('api')
          || location.origin.replace(/\/$/, '');

const $ = id => document.getElementById(id);
const BANDS = {
  likely_authentic:   ['#3fb950', 'Looks authentic'],
  leaning_authentic:  ['#57ab5a', 'Probably authentic'],
  uncertain:          ['#d29922', 'Inconclusive'],
  leaning_manipulated:['#e07b39', 'Possibly manipulated'],
  likely_manipulated: ['#f85149', 'Likely manipulated'],
  undetermined:       ['#8b949e', 'Could not analyse this'],
};

// One sentence per band, in the words someone would use. Each says what was
// OBSERVED, never what the image is: "no signs were found" is a fact about the
// detector, "this photo is real" is a claim about the world that an
// uncalibrated research checkpoint cannot make. The band names above are the
// same hedge, and these must not read as more certain than they do.
const PLAIN = {
  likely_authentic:
    'No signs of face manipulation were found.',
  leaning_authentic:
    'Very little to suggest manipulation, but not a clean result.',
  uncertain:
    'The signals point both ways. This one needs a human to look at it.',
  leaning_manipulated:
    'Some signs consistent with manipulation — but compression and screenshots ' +
    'look similar to this detector, so check how the photo was saved before ' +
    'concluding anything.',
  likely_manipulated:
    'Strong signs consistent with manipulation. Worth a closer look — this is ' +
    'a reason to check, not a conclusion.',
  undetermined:
    'No face could be read in this file, so nothing was scored. That is not the ' +
    'same as finding nothing wrong — it means the photo was never analysed.',
};

// Health is polled and shown, rather than inferred from a stalled upload. A
// dead inference worker is otherwise indistinguishable from a slow model, and
// the API reports worker liveness explicitly for exactly this reason.
async function health() {
  try {
    const r = await fetch(`${API}/healthz`);
    const d = await r.json();
    const dead = Object.entries(d.workers || {}).filter(([, up]) => !up).map(([k]) => k);
    $('dot').className = 'dot ' + (r.ok && !dead.length ? 'up' : 'down');
    $('health').textContent = !dead.length ? `all workers up · ${d.inference_backend}`
      : (d.warming ? `starting: ${dead.join(', ')}` : `unavailable: ${dead.join(', ')}`);
  } catch {
    $('dot').className = 'dot down';
    $('health').textContent = 'API unreachable';
  }
}
health(); setInterval(health, 15000);

let picked = null;
$('file').onchange = e => {
  picked = e.target.files[0] || null;
  $('go').disabled = !picked;
  if (picked) $('drop').querySelector('div').innerHTML =
    `<b>${picked.name}</b> · ${(picked.size / 1048576).toFixed(1)} MB`;
};
const drop = $('drop');
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) { $('file').files = e.dataTransfer.files; $('file').onchange({ target: { files: [f] } }); }
});

$('go').onclick = async () => {
  if (!picked) return;
  $('go').disabled = true; $('out').innerHTML = '';
  const stage = m => $('stage').textContent = m;
  try {
    stage('requesting upload grant…');
    const jr = await fetch(`${API}/v1/jobs`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ media_type: 'image', content_type: picked.type || 'image/jpeg' }),
    });
    if (!jr.ok) throw new Error(`job create failed: ${jr.status} ${await jr.text()}`);
    const job = await jr.json();

    stage('uploading…');
    // Same multipart shape whether the grant points at S3 or back at this API,
    // so the client cannot tell which storage backend is behind it.
    const form = new FormData();
    for (const [k, v] of Object.entries(job.upload_fields || {})) form.append(k, v);
    form.append('file', picked, picked.name);
    const up = await fetch(job.upload_url, { method: 'POST', body: form });
    if (!up.ok) throw new Error(`upload failed: ${up.status} ${await up.text()}`);

    stage('queued for analysis…');
    const ack = await fetch(`${API}/v1/jobs/${job.job_id}/uploaded`, { method: 'POST' });
    if (!ack.ok) throw new Error(`notify failed: ${ack.status}`);

    // Bounded poll. A spinner that never resolves is the failure mode this
    // avoids: after the deadline, say so instead of spinning.
    const deadline = Date.now() + 90000;
    let doc;
    while (Date.now() < deadline) {
      const r = await fetch(`${API}/v1/jobs/${job.job_id}`);
      doc = await r.json();
      if (['complete', 'failed', 'dead_letter'].includes(doc.status)) break;
      stage(`${doc.live_status || doc.status}…`);
      await new Promise(s => setTimeout(s, 900));
    }
    stage('');
    if (!doc || !['complete', 'failed', 'dead_letter'].includes(doc.status))
      throw new Error('timed out after 90s. Check the worker status indicator above.');
    render(doc);
  } catch (e) {
    stage('');
    $('out').innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div></div>`;
  } finally {
    $('go').disabled = false;
  }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(d) {
  if (d.status !== 'complete') {
    $('out').innerHTML = `<div class="panel"><div class="err">
      Job ${esc(d.status)}: ${esc(d.failure_reason || 'no reason recorded')}</div></div>`;
    return;
  }
  const [colour, label] = BANDS[d.band] || BANDS.undetermined;
  const ev = d.face_evidence || {};
  const scored = ev.top_faces || [], gated = ev.discarded_faces || [];
  const plain = PLAIN[d.band] || PLAIN.undetermined;
  const score = d.aggregate_score;

  // The scale, drawn. Bands are 20 wide, so the track is five equal zones in
  // the same colours the verdict uses, with the score pinned on it. This is the
  // only thing on the page that says which direction is bad.
  const meter = score === null || score === undefined ? '' : `
    <div class="meter">
      <div class="track">
        ${['likely_authentic','leaning_authentic','uncertain','leaning_manipulated',
           'likely_manipulated'].map(b => `<i style="background:${BANDS[b][0]}"></i>`).join('')}
        <span class="pin" style="left:${Math.max(0, Math.min(100, score))}%"></span>
      </div>
      <div class="ends"><span><b>0</b> no signs</span>
        <span>strong signs <b>100</b></span></div>
    </div>`;

  // Shown only when it adds something. For the ordinary one-face photo the
  // table restated the headline in smaller type; a second face, or a discarded
  // detection, is the case where per-face numbers actually inform.
  const worthTable = scored.length > 1 || gated.length > 0;

  // Numbered in DISPLAY order, not by face_index. The index is an internal
  // position in the detector's output, so the scored face came out as "Face 2"
  // with the skipped ones either side of it -- a reader has no way to know the
  // numbering is not a ranking.
  //
  // The "note" column carries the gate's own reasoning. The previous version
  // printed the raw detection confidence as a percentage, which reads as a
  // calibrated quantity and is not one: it is an unbounded Haar reject level
  // divided by 10. What actually decided the outcome is the RELATIVE strength,
  // which is the number the gate compares, so that is what is shown.
  let n = 0;
  const rows = [
    ...scored.map(f => `<tr><td>Face ${++n}</td>
      <td><b>${f.score.toFixed(1)}</b></td>
      <td>${f.face_w ? `${f.face_w}×${f.face_h}` : '—'}</td>
      <td>${scored.length + gated.length > 1 ? 'clearest face' : 'scored'}</td></tr>`),
    ...gated.map(f => `<tr class="gated"><td>Face ${++n}</td>
      <td>—</td>
      <td>${f.face_w ? `${f.face_w}×${f.face_h}` : '—'}</td>
      <td>skipped — ${f.relative_to_best === undefined ? 'too weak'
        : `${(f.relative_to_best * 100).toFixed(0)}% as strong`}</td></tr>`),
  ].join('');

  const facts = [
    `${ev.faces_total ?? d.face_count ?? 0} ${
      (ev.faces_total ?? d.face_count ?? 0) === 1 ? 'face' : 'faces'} checked`,
    gated.length ? `${gated.length} weak detection${gated.length > 1 ? 's' : ''} skipped` : '',
    // media_deleted can be false for a moment after a job reports complete:
    // the router records the verdict BEFORE destroying the media, so a crash
    // between the two loses the photo but keeps the finding. That ordering is
    // deliberate, so this text has to describe a pending delete rather than a
    // failed one.
    d.media_deleted ? 'your photo was deleted' : 'deleting your photo…',
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  $('out').innerHTML = `
    <div class="panel">
      <p class="headline" style="color:${colour}">${label}</p>
      <p class="plain">${plain}</p>
      ${meter}
      <div class="facts">${facts}</div>
      ${worthTable ? `<table><tr><th>face</th><th>score</th><th>size px</th><th></th></tr>
        ${rows}</table>
        ${gated.length ? `<div class="hint">A face detected far less strongly than the
          clearest one in the photo is skipped rather than scored — usually it is not a
          face, and a made-up number from it would decide the verdict.</div>` : ''}` : ''}

      <div class="caution">
        <span>&#9888;</span>
        <div><b>Early prototype — a rough signal, not proof.</b>
        Screenshots and heavily compressed photos often score high even when genuine.
        The score is not a percentage or a probability.</div>
      </div>

      <details>
        <summary>Technical details</summary>
        <ul class="adv">${(d.advisories || []).map(a => `<li>${esc(a)}</li>`).join('')}</ul>
        <div class="meta">
          <div><span>score</span>${score === null || score === undefined
            ? '—' : score.toFixed(4)}</div>
          <div><span>band</span>${esc(d.band || '—')}</div>
          <div><span>coverage</span>${d.coverage === null || d.coverage === undefined
            ? '—' : (d.coverage * 100).toFixed(0) + '%'}
            ${d.items_total ? ` (${d.item_count}/${d.items_total})` : ''}</div>
          <div><span>trust level</span>${esc(d.model_validation || 'not recorded')}</div>
          <div><span>calibration</span>${esc(d.calibration || 'not recorded')}</div>
          <div><span>model</span><code>${esc(d.model_version_id || 'none')}</code></div>
        </div>
      </details>
    </div>`;
}
</script>
</body>
</html>
