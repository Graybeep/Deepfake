# MVP deployment: single node, one image per service.
#
# No Kubernetes manifests until this runs end to end (CLAUDE.md) -- cluster
# provisioning, secrets, ingress and PVCs are multi-day work on their own and
# would eat the 5-day budget before any detection code ships.
#
# Network layout is a security control, not tidiness:
#   edge     -- reachable from the host. Gateway only.
#   internal -- `internal: true`, no route off the host. Everything that parses
#               untrusted media lives here. The CPU worker is the process that
#               opens attacker-supplied video/audio and there is NO AV scanning
#               in front of it (Tier 3, deferred), so its isolation and lockdown
#               ship with it -- not later.

name: deepfake

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepfake
      POSTGRES_PASSWORD: deepfake
      POSTGRES_DB: deepfake
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfake"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Tier 1: persistence MUST be on. A default redis:7 keeps everything in
    # memory, so a restart drops job status and every queued message.
    # jobstatus.assert_persistence_enabled() refuses to start without this.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    # On edge too: the browser PUTs to the presigned URL directly, so the
    # storage endpoint has to be reachable from outside. In a deployed
    # environment this is S3 and the service disappears from compose entirely.
    networks: [internal, edge]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # `mc ready` reports cluster READINESS; /minio/health/live reports liveness.
      # minio-init depends on this healthcheck, so a live-but-not-ready server
      # would let bucket creation race. Not because curl is missing -- it is
      # present in the image and the liveness endpoint works (checked 2026-08-18);
      # CLAUDE.md previously claimed otherwise and was wrong.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    networks: [internal]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      DF_S3_BUCKET: ${DF_S3_BUCKET:-deepfake-ingest}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$DF_S3_BUCKET &&
      mc anonymous set none local/$$DF_S3_BUCKET &&
      echo 'bucket ready'
      "

  migrate:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    env_file: [.env]
    networks: [internal]
    command: ["python", "scripts/migrate.py"]
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    env_file: [.env]
    networks: [edge, internal]
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "df.gateway.app:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  cpu-preprocess:
    build:
      context: .
      dockerfile: docker/cpu.Dockerfile
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file: [.env]
    # internal ONLY. This container decodes untrusted media; it must have no
    # route off the host. Substitutes for the AV scanning that is deferred.
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    command: ["python", "-m", "df.workers.cpu_preprocess"]
    restart: unless-stopped

  gpu-inference:
    build:
      context: .
      dockerfile: docker/gpu.Dockerfile
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file: [.env]
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    command: ["python", "-m", "df.workers.gpu_inference"]
    restart: unless-stopped
    # GPU passthrough lives in docker-compose.gpu.yml so this file still comes
    # up on a machine without an NVIDIA runtime:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

  router:
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file: [.env]
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    command: ["python", "-m", "df.workers.router"]
    restart: unless-stopped

  retention-sweeper:
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file: [.env]
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: ["python", "-m", "df.workers.retention_sweeper"]
    restart: unless-stopped
